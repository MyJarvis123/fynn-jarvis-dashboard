<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KARTEI — JARVIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-gradient: linear-gradient(135deg, #0f0f1e 0%, #1a1a2e 100%);
    --bg-card: rgba(20, 20, 40, 0.8);
    --bg-card-hover: rgba(20, 20, 40, 1);
    --cyan: #00ffc8;
    --text-primary: #e0e0e0;
    --text-secondary: #999;
    --text-accent: #00ffc8;
    --border-color: rgba(0, 255, 200, 0.15);
    --border-hover: rgba(0, 255, 200, 0.4);
    --glow: 0 8px 32px rgba(0, 255, 200, 0.1);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg-gradient);
    background-attachment: fixed;
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 14px;
    min-height: 100vh;
  }

  /* HEADER/NAVBAR */
  .navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 32px;
    background: rgba(20, 20, 40, 0.95);
    border-bottom: 1px solid var(--border-color);
    margin-bottom: 32px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .navbar-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--cyan);
    letter-spacing: 1px;
  }

  .navbar-button {
    background: rgba(0, 255, 200, 0.1);
    border: 1px solid var(--border-color);
    color: var(--cyan);
    padding: 10px 16px;
    border-radius: 6px;
    font-weight: 600;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  .navbar-button:hover {
    background: rgba(0, 255, 200, 0.2);
    border-color: var(--border-hover);
  }

  /* MAIN CONTAINER */
  #app {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 32px 90px;
  }

  /* HEADER/TITLE */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 24px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }

  .header-title {
    font-size: 32px;
    font-weight: 700;
    color: var(--cyan);
    letter-spacing: 1px;
  }

  /* CARD BASE */
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 24px;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .card:hover {
    border-color: var(--border-hover);
    background: var(--bg-card-hover);
    box-shadow: var(--glow);
    transform: translateY(-2px);
  }

  .card-title {
    font-size: 13px;
    font-weight: 700;
    color: #b0b0b0;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border-color);
  }

  /* DECK GRID */
  .deck-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 24px;
    margin-bottom: 32px;
  }

  .deck-box {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 24px;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .deck-box:hover {
    border-color: var(--border-hover);
    background: var(--bg-card-hover);
    box-shadow: var(--glow);
    transform: translateY(-4px);
  }

  .deck-box h3 {
    font-size: 18px;
    font-weight: 700;
    color: var(--text-primary);
    margin: 0 0 8px 0;
  }

  .deck-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--border-color);
  }

  .deck-info {
    font-size: 13px;
    color: var(--text-secondary);
  }

  .deck-due {
    font-size: 12px;
    background: rgba(0, 255, 200, 0.15);
    color: var(--cyan);
    padding: 4px 10px;
    border-radius: 4px;
    font-weight: 600;
  }

  /* TOOLBAR */
  .toolbar {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 24px;
  }

  /* BUTTONS */
  .btn {
    background: rgba(0, 255, 200, 0.1);
    border: 1px solid var(--border-color);
    color: var(--cyan);
    padding: 12px 20px;
    border-radius: 6px;
    font-weight: 600;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  .btn:hover:not(:disabled) {
    background: rgba(0, 255, 200, 0.2);
    border-color: var(--border-hover);
  }

  .btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .btn.primary {
    background: var(--cyan);
    color: #0f0f1e;
  }

  .btn.primary:hover:not(:disabled) {
    background: #33ffdb;
  }

  /* CARD ROWS */
  .card-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 10px;
    transition: all 0.2s ease;
  }

  .card-row:hover {
    border-color: var(--border-hover);
    background: var(--bg-card-hover);
  }

  .card-row-content {
    flex: 1;
  }

  .card-row-q {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 4px;
  }

  .card-row-a {
    font-size: 13px;
    color: var(--cyan);
  }

  .card-row-actions {
    display: flex;
    gap: 8px;
  }

  .icon-btn {
    background: rgba(0, 255, 200, 0.1);
    border: 1px solid var(--border-color);
    color: var(--cyan);
    padding: 6px 10px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
    transition: all 0.2s ease;
  }

  .icon-btn:hover {
    background: rgba(0, 255, 200, 0.2);
    border-color: var(--border-hover);
  }

  /* PANELS */
  .panel {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 24px;
  }

  .panel h2 {
    font-size: 16px;
    font-weight: 700;
    color: var(--cyan);
    margin: 0 0 16px 0;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border-color);
  }

  /* FORM ELEMENTS */
  label {
    display: block;
    font-size: 12px;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 6px;
    margin-top: 14px;
    font-weight: 600;
  }

  input[type="text"],
  input[type="email"],
  input[type="number"],
  textarea,
  select {
    width: 100%;
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid var(--border-color);
    border-radius: 6px;
    padding: 10px;
    color: var(--text-primary);
    font-family: inherit;
    font-size: 14px;
    transition: all 0.2s ease;
  }

  input[type="text"]:focus,
  input[type="email"]:focus,
  input[type="number"]:focus,
  textarea:focus,
  select:focus {
    outline: none;
    border-color: var(--border-hover);
    background: rgba(0, 0, 0, 0.5);
    box-shadow: 0 0 12px rgba(0, 255, 200, 0.2);
  }

  textarea {
    min-height: 100px;
    resize: vertical;
  }

  /* EMPTY STATE */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-secondary);
  }

  .empty-state-title {
    font-size: 18px;
    font-weight: 600;
    color: var(--cyan);
    margin-bottom: 8px;
  }

  /* STUDY MODE */
  .study-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
  }

  .progress-info {
    font-size: 14px;
    color: var(--text-secondary);
    margin-bottom: 24px;
  }

  .card-stage {
    width: 100%;
    max-width: 500px;
    margin-bottom: 32px;
  }

  .flip-card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 40px;
    min-height: 300px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  .flip-card:hover {
    border-color: var(--border-hover);
    box-shadow: var(--glow);
  }

  .flip-card-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-secondary);
    margin-bottom: 16px;
  }

  .flip-card-content {
    font-size: 20px;
    font-weight: 600;
    color: var(--text-primary);
    line-height: 1.6;
  }

  .flip-card-hint {
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 20px;
  }

  /* GRADE BUTTONS */
  .grade-row {
    display: flex;
    gap: 12px;
    width: 100%;
    max-width: 500px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .grade-btn {
    background: rgba(0, 255, 200, 0.1);
    border: 1px solid var(--border-color);
    color: var(--cyan);
    padding: 12px 20px;
    border-radius: 6px;
    font-weight: 600;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s ease;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .grade-btn:hover {
    background: rgba(0, 255, 200, 0.2);
    border-color: var(--border-hover);
  }

  /* XP BAR */
  .xp-bar {
    width: 100%;
    height: 20px;
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid var(--border-color);
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 8px;
  }

  .xp-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--cyan) 0%, #33ffdb 100%);
    transition: width 0.4s ease;
  }

  .xp-info {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-secondary);
  }

  /* RESPONSIVE */
  @media (max-width: 768px) {
    .navbar {
      padding: 12px 16px;
    }

    #app {
      padding: 0 16px 60px;
    }

    .header-title {
      font-size: 24px;
    }

    .deck-grid {
      grid-template-columns: 1fr;
    }

    .flip-card {
      padding: 30px 20px;
      min-height: 250px;
    }

    .grade-row {
      flex-direction: column;
    }

    .grade-btn {
      width: 100%;
    }
  }
</style>
</head>
<body>

<div class="navbar">
  <div class="navbar-title">📚 KARTEI QUEST</div>
  <a href="index.html" class="navbar-button">← Zurück zu HUB</a>
</div>

<div id="app">
  <div class="empty-state">
    <div class="empty-state-title">LADE KARTEI...</div>
  </div>
</div>

<script>
(function(){
  "use strict";

  const STORAGE_KEY = "kartei-data-v3";
  const XP_PER_CARD = 10;

  let state = {
    decks: [],
    cards: [],
    globalXp: 0,
    settings: { soundOn: false, volume: 0.15, keyboardEnabled: true },
    streak: { count: 0, lastDate: null },
    stats: { totalReviewed: 0, gradeCounts: { again: 0, hard: 0, good: 0, easy: 0 } },
    achievements: []
  };

  let view = { name: "home" };
  let storageReady = false;

  function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36); }
  function todayISO() { const d = new Date(); d.setHours(0, 0, 0, 0); return d.toISOString().slice(0, 10); }
  function addDays(iso, days) { const d = new Date(iso + "T00:00:00"); d.setDate(d.getDate() + days); return d.toISOString().slice(0, 10); }
  function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

  async function loadData() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        state.decks = Array.isArray(parsed.decks) ? parsed.decks : [];
        state.cards = Array.isArray(parsed.cards) ? parsed.cards : [];
        state.globalXp = typeof parsed.globalXp === "number" ? parsed.globalXp : 0;
        if (parsed.settings) state.settings = Object.assign({}, state.settings, parsed.settings);
        if (parsed.streak) state.streak = parsed.streak;
        if (parsed.stats) state.stats = parsed.stats;
        if (Array.isArray(parsed.achievements)) state.achievements = parsed.achievements;
      }
    } catch (e) { console.log("Keine gespeicherten Daten.", e); }
    storageReady = true;
  }

  async function saveData() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch (e) { console.error("Speicherfehler:", e); }
  }

  // SOUND - nur Basics, keine Musik
  function beep(freq, dur) {
    if (!state.settings.soundOn || !freq) return;
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(state.settings.volume, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + dur);
    } catch (e) {}
  }

  function cardsForDeck(deckId) { return state.cards.filter(c => c.deckId === deckId); }
  function dueCardsForDeck(deckId) { const t = todayISO(); return cardsForDeck(deckId).filter(c => !c.due || c.due <= t); }
  function shuffle(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  function scheduleCard(card, grade) {
    if (card.ease == null) card.ease = 2.5;
    if (card.interval == null) card.interval = 0;
    if (card.reps == null) card.reps = 0;
    if (grade === "again") { card.reps = 0; card.interval = 0; card.ease = Math.max(1.3, card.ease - 0.2); card.due = todayISO(); }
    else if (grade === "hard") { card.interval = Math.max(1, Math.round((card.interval || 1) * 1.2)); card.ease = Math.max(1.3, card.ease - 0.15); card.reps += 1; card.due = addDays(todayISO(), card.interval); }
    else if (grade === "good") { if (card.reps === 0) card.interval = 1; else if (card.reps === 1) card.interval = 6; else card.interval = Math.round(card.interval * card.ease); card.reps += 1; card.due = addDays(todayISO(), card.interval); }
    else if (grade === "easy") { card.interval = Math.max(4, Math.round((card.interval || 1) * card.ease * 1.3)); card.ease = card.ease + 0.15; card.reps += 1; card.due = addDays(todayISO(), card.interval); }
  }

  const app = document.getElementById("app");

  function render() {
    if (!storageReady) { app.innerHTML = '<div class="empty-state"><div class="empty-state-title">LADE...</div></div>'; return; }
    if (view.name === "home") return renderHome();
    if (view.name === "deck") return renderDeck();
    if (view.name === "study") return renderStudy();
  }

  function renderHome() {
    let grid = "";
    if (state.decks.length === 0) {
      grid = `<div class="empty-state"><div class="empty-state-title">KEINE FÄCHER VORHANDEN</div><p style="margin-top: 8px; color: var(--text-secondary);">Erstelle dein erstes Fach, um zu starten.</p></div>`;
    } else {
      grid = state.decks.map(d => {
        const total = cardsForDeck(d.id).length;
        const due = dueCardsForDeck(d.id).length;
        return `
          <div class="deck-box" data-deck="${d.id}" style="cursor: pointer;">
            <h3>${escapeHtml(d.name)}</h3>
            <div class="deck-meta">
              <div class="deck-info">${total} Karte${total === 1 ? "" : "n"}</div>
              <div class="deck-due">${due > 0 ? due + " fällig" : "✓ Fertig"}</div>
            </div>
          </div>`;
      }).join("");
    }
    app.innerHTML = `
      <div class="header">
        <div class="header-title">📚 KARTEI QUEST</div>
      </div>
      <div class="toolbar">
        <button class="btn primary" id="btn-new-deck">+ Neues Fach</button>
      </div>
      <div class="deck-grid">${grid}</div>
    `;
    document.getElementById("btn-new-deck").onclick = () => {
      const name = prompt("Fachname:");
      if (name && name.trim()) {
        state.decks.push({ id: uid(), name: name.trim(), createdAt: Date.now(), xp: 0 });
        saveData().then(() => render());
      }
    };
    app.querySelectorAll(".deck-box").forEach(el => {
      el.onclick = () => { view = { name: "deck", deckId: el.dataset.deck }; render(); };
    });
  }

  function renderDeck() {
    const deck = state.decks.find(d => d.id === view.deckId);
    if (!deck) { view = { name: "home" }; return render(); }
    const cards = cardsForDeck(deck.id);
    const due = dueCardsForDeck(deck.id);
    const rows = cards.map(c => `
      <div class="card-row">
        <div class="card-row-content">
          <div class="card-row-q">${escapeHtml(c.question)}</div>
          <div class="card-row-a">${escapeHtml(c.answer)}</div>
        </div>
        <div class="card-row-actions">
          <button class="icon-btn edit" data-card="${c.id}">✎</button>
          <button class="icon-btn del" data-card="${c.id}" style="color: #ff6b6b;">✕</button>
        </div>
      </div>`).join("");

    app.innerHTML = `
      <div class="header">
        <div class="header-title">${escapeHtml(deck.name)}</div>
      </div>
      <div class="toolbar">
        <button class="btn primary" id="btn-study" ${due.length === 0 ? "disabled" : ""}>LERNEN (${due.length})</button>
        <button class="btn" id="btn-add">+ Karte</button>
        <button class="btn" id="btn-del" style="color: #ff6b6b;">Fach löschen</button>
        <button class="btn" id="btn-home">← Zur Übersicht</button>
      </div>
      <div id="add-panel" class="panel" style="display: none;">
        <h2 id="panel-title">Neue Karte</h2>
        <input type="text" id="f-q" placeholder="Frage (Vorderseite)" style="margin-top: 14px;">
        <textarea id="f-a" placeholder="Antwort (Rückseite)" style="margin-top: 12px;"></textarea>
        <div class="toolbar" style="margin-top: 16px; margin-bottom: 0;">
          <button class="btn primary" id="save-card">Speichern</button>
          <button class="btn" id="cancel-card">Abbrechen</button>
        </div>
      </div>
      <div>${rows.length ? rows : '<div class="empty-state"><div class="empty-state-title">Keine Karten</div></div>'}</div>
    `;

    document.getElementById("btn-home").onclick = () => { view = { name: "home" }; render(); };
    document.getElementById("btn-study").onclick = () => { if (due.length) { view = { name: "study", deckId: deck.id, queue: shuffle(due.map(c => c.id)), pos: 0, showAnswer: false, sessionDone: 0 }; render(); } };
    document.getElementById("btn-add").onclick = () => { document.getElementById("add-panel").style.display = document.getElementById("add-panel").style.display === "block" ? "none" : "block"; };
    document.getElementById("cancel-card").onclick = () => { document.getElementById("add-panel").style.display = "none"; };
    document.getElementById("save-card").onclick = async () => {
      const q = document.getElementById("f-q").value.trim();
      const a = document.getElementById("f-a").value.trim();
      if (q && a) {
        state.cards.push({ id: uid(), deckId: deck.id, question: q, answer: a, ease: 2.5, interval: 0, reps: 0, due: todayISO(), createdAt: Date.now() });
        await saveData();
        render();
      }
    };
    document.getElementById("btn-del").onclick = async () => {
      if (confirm(`Fach "${deck.name}" wirklich löschen?`)) {
        state.decks = state.decks.filter(d => d.id !== deck.id);
        state.cards = state.cards.filter(c => c.deckId !== deck.id);
        await saveData();
        view = { name: "home" };
        render();
      }
    };
    app.querySelectorAll(".del").forEach(btn => {
      btn.onclick = async () => { state.cards = state.cards.filter(c => c.id !== btn.dataset.card); await saveData(); render(); };
    });
  }

  function renderStudy() {
    const deck = state.decks.find(d => d.id === view.deckId);
    if (!deck || view.pos >= view.queue.length) {
      app.innerHTML = `
        <div class="study-wrap">
          <div class="empty-state" style="padding-top: 60px;">
            <div class="empty-state-title">✓ FERTIG!</div>
            <p style="margin-top: 12px; color: var(--text-secondary);">${view.sessionDone || 0} Karten gelernt</p>
            <button class="btn primary" id="btn-back" style="margin-top: 20px;">Zurück</button>
          </div>
        </div>`;
      document.getElementById("btn-back").onclick = () => { view = { name: "deck", deckId: deck.id }; render(); };
      return;
    }

    const cardId = view.queue[view.pos];
    const card = state.cards.find(c => c.id === cardId);
    if (!card) { view.pos++; return renderStudy(); }

    app.innerHTML = `
      <div class="study-wrap">
        <div class="progress-info">KARTE ${view.pos + 1} / ${view.queue.length}</div>
        <div class="card-stage">
          <div class="flip-card" id="flip-card" tabindex="0">
            <div class="flip-card-label">${view.showAnswer ? "ANTWORT" : "FRAGE"}</div>
            <div class="flip-card-content">${view.showAnswer ? escapeHtml(card.answer) : escapeHtml(card.question)}</div>
            <div class="flip-card-hint">${view.showAnswer ? "" : "Klicken zum Umdrehen"}</div>
          </div>
        </div>
        ${view.showAnswer ? `
        <div class="grade-row">
          <button class="grade-btn" data-grade="again">Nochmal</button>
          <button class="grade-btn" data-grade="hard">Schwer</button>
          <button class="grade-btn" data-grade="good">Gut</button>
          <button class="grade-btn" data-grade="easy">Leicht</button>
        </div>` : ""}
      </div>`;

    const flipEl = document.getElementById("flip-card");
    flipEl.onclick = () => { view.showAnswer = !view.showAnswer; beep(440, 0.1); render(); };
    flipEl.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); view.showAnswer = !view.showAnswer; beep(440, 0.1); render(); } };

    app.querySelectorAll(".grade-btn").forEach(btn => {
      btn.onclick = async () => {
        const grade = btn.dataset.grade;
        state.stats.totalReviewed += 1;
        state.stats.gradeCounts[grade] = (state.stats.gradeCounts[grade] || 0) + 1;
        scheduleCard(card, grade);
        state.globalXp += XP_PER_CARD;
        await saveData();
        view.pos++;
        view.showAnswer = false;
        view.sessionDone++;
        beep(530, 0.15);
        render();
      };
    });
  }

  (async function init() {
    await loadData();
    if (state.decks.length === 0) {
      const deckId = uid();
      state.decks.push({ id: deckId, name: "Testfach", createdAt: Date.now(), xp: 0 });
      const tests = [
        { q: "Wie viele Bundesländer hat Deutschland?", a: "16" },
        { q: "Was ist die Hauptstadt von Hessen?", a: "Wiesbaden" },
        { q: "Wer war der erste Bundespräsident?", a: "Theodor Heuss" }
      ];
      tests.forEach(t => { state.cards.push({ id: uid(), deckId, question: t.q, answer: t.a, ease: 2.5, interval: 0, reps: 0, due: todayISO(), createdAt: Date.now() }); });
      await saveData();
    }
    render();
  })();
})();
</script>

</body>
</html>
