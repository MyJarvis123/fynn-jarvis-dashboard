<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIBLIOTHEK — JARVIS</title>
<!-- ⚠️ Persistent Storage MUSS ZUERST geladen werden -->
<script src="persistent-storage.js"></script>
<!-- Optimized Storage (IndexedDB for large data) -->
<script src="indexed-storage.js"></script>
<style>
  :root {
    --bg-gradient: linear-gradient(135deg, #0f0f1e 0%, #1a1a2e 100%);
    --bg-card: rgba(20, 20, 40, 0.8);
    --bg-card-hover: rgba(20, 20, 40, 1);
    --cyan: #00ffc8;
    --text-primary: #e0e0e0;
    --text-secondary: #999;
    --border-color: rgba(0, 255, 200, 0.15);
    --border-hover: rgba(0, 255, 200, 0.4);
    --glow: 0 8px 32px rgba(0, 255, 200, 0.1);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg-gradient);
    background-attachment: fixed;
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 14px;
    min-height: 100vh;
  }

  .navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 32px;
    background: rgba(20, 20, 40, 0.95);
    border-bottom: 1px solid var(--border-color);
    margin-bottom: 32px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .navbar-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--cyan);
    letter-spacing: 1px;
  }

  .navbar-button {
    background: rgba(0, 255, 200, 0.1);
    border: 1px solid var(--border-color);
    color: var(--cyan);
    padding: 10px 16px;
    border-radius: 6px;
    font-weight: 600;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  .navbar-button:hover {
    background: rgba(0, 255, 200, 0.2);
    border-color: var(--border-hover);
  }

  #app {
    max-width: 1400px;
    margin: 0 auto;
    padding: 0 32px 90px;
  }

  .header {
    font-size: 32px;
    font-weight: 700;
    color: var(--cyan);
    letter-spacing: 1px;
    margin-bottom: 24px;
  }

  .card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 24px;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    margin-bottom: 24px;
  }

  .card-title {
    font-size: 13px;
    font-weight: 700;
    color: #b0b0b0;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border-color);
  }

  label {
    display: block;
    font-size: 11px;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 6px;
    margin-top: 14px;
    font-weight: 600;
  }

  input[type="text"],
  input[type="email"],
  textarea,
  select {
    width: 100%;
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid var(--border-color);
    border-radius: 6px;
    padding: 10px;
    color: var(--text-primary);
    font-family: inherit;
    font-size: 14px;
    transition: all 0.2s ease;
    margin-bottom: 12px;
  }

  input[type="text"]:focus,
  textarea:focus,
  select:focus {
    outline: none;
    border-color: var(--border-hover);
    background: rgba(0, 0, 0, 0.5);
    box-shadow: 0 0 12px rgba(0, 255, 200, 0.2);
  }

  textarea {
    min-height: 80px;
    resize: vertical;
  }

  .btn {
    background: rgba(0, 255, 200, 0.1);
    border: 1px solid var(--border-color);
    color: var(--cyan);
    padding: 10px 16px;
    border-radius: 6px;
    font-weight: 600;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  .btn:hover {
    background: rgba(0, 255, 200, 0.2);
    border-color: var(--border-hover);
  }

  .btn.primary {
    background: var(--cyan);
    color: #0f0f1e;
  }

  .btn.primary:hover {
    background: #33ffdb;
  }

  .toolbar {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 24px;
  }

  .book-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
  }

  .book-card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 20px;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .book-card:hover {
    border-color: var(--border-hover);
    background: var(--bg-card-hover);
    box-shadow: var(--glow);
    transform: translateY(-4px);
  }

  .book-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--cyan);
    margin-bottom: 4px;
  }

  .book-author {
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 12px;
  }

  .book-rating {
    font-size: 14px;
    color: #ffd700;
    margin-bottom: 8px;
  }

  .book-meta {
    font-size: 12px;
    color: var(--text-secondary);
    margin-bottom: 12px;
    line-height: 1.5;
  }

  .book-notes {
    font-size: 13px;
    color: var(--text-secondary);
    background: rgba(0, 0, 0, 0.2);
    border-left: 2px solid var(--cyan);
    padding: 10px;
    border-radius: 4px;
    margin-bottom: 12px;
  }

  .book-actions {
    display: flex;
    gap: 8px;
  }

  .icon-btn {
    background: rgba(0, 255, 200, 0.1);
    border: 1px solid var(--border-color);
    color: var(--cyan);
    padding: 6px 10px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
    transition: all 0.2s ease;
    flex: 1;
  }

  .icon-btn:hover {
    background: rgba(0, 255, 200, 0.2);
    border-color: var(--border-hover);
  }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-secondary);
  }

  .filter-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }

  .filter-input {
    flex: 1;
    min-width: 200px;
  }

  .stat-box {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 16px;
    text-align: center;
    margin-bottom: 16px;
  }

  .stat-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-secondary);
    margin-bottom: 8px;
  }

  .stat-value {
    font-size: 24px;
    font-weight: 700;
    color: var(--cyan);
  }

  @media (max-width: 768px) {
    .navbar {
      padding: 12px 16px;
    }

    #app {
      padding: 0 16px 60px;
    }

    .book-grid {
      grid-template-columns: 1fr;
    }

    .filter-row {
      flex-direction: column;
    }

    .filter-input {
      min-width: auto;
    }
  }
</style>
</head>
<body>

<div class="navbar">
  <div class="navbar-title">📚 BIBLIOTHEK</div>
  <a href="index.html" class="navbar-button">← Zurück zu HUB</a>
</div>

<div id="app">
  <div class="header">📚 MEINE BIBLIOTHEK</div>

  <div class="stat-box" style="max-width: 300px;">
    <div class="stat-label">Gelesene Bücher</div>
    <div class="stat-value" id="book-count">0</div>
  </div>

  <div class="card">
    <div class="card-title">Neues Buch hinzufügen</div>
    <input type="text" id="book-title" placeholder="Buchtitel" style="margin-top: 14px;">
    <input type="text" id="book-author" placeholder="Autor">
    <textarea id="book-notes" placeholder="Notizen & Zusammenfassung (optional)"></textarea>
    <label>Rating</label>
    <select id="book-rating">
      <option value="">--- Bewertung wählen ---</option>
      <option value="⭐">⭐ 1 Stern</option>
      <option value="⭐⭐">⭐⭐ 2 Sterne</option>
      <option value="⭐⭐⭐">⭐⭐⭐ 3 Sterne</option>
      <option value="⭐⭐⭐⭐">⭐⭐⭐⭐ 4 Sterne</option>
      <option value="⭐⭐⭐⭐⭐">⭐⭐⭐⭐⭐ 5 Sterne</option>
    </select>
    <button class="btn primary" id="add-book" style="margin-top: 12px;">Buch hinzufügen</button>
  </div>

  <div class="toolbar">
    <input type="text" id="search-books" placeholder="Nach Titel oder Autor suchen..." class="filter-input">
    <button class="btn" id="export-books">📥 Exportieren</button>
  </div>

  <div class="book-grid" id="books-list"></div>
</div>

<script>
(function(){
  "use strict";

  const STORAGE_KEY = "library-data-v2";
  let state = { books: [] };

  function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36); }

  async function loadData() {
    try {
      if (!isLocalStorageAvailable()) {
        console.warn("localStorage nicht verfügbar (Private Mode?)");
        return;
      }
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        state.books = Array.isArray(parsed.books) ? parsed.books : (Array.isArray(parsed) ? parsed : []);
      }
    } catch (e) { console.error("Fehler beim Laden der Bücher:", e); }
  }

  async function saveData() {
    try {
      if (!isLocalStorageAvailable()) {
        console.warn("localStorage nicht verfügbar, kann nicht speichern");
        return false;
      }
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      // Sync zu Firebase wenn verfügbar
      if (false) { // Firebase deactivated
        
      }
      return true;
    } catch (e) {
      console.error("Speicherfehler:", e);
      return false;
    }
  }

  function isLocalStorageAvailable() {
    try {
      const test = "__localStorage_test__";
      localStorage.setItem(test, test);
      localStorage.removeItem(test);
      return true;
    } catch (e) {
      return false;
    }
  }

  function render() {
    const query = document.getElementById("search-books").value.toLowerCase();
    const filtered = state.books.filter(b =>
      b.title.toLowerCase().includes(query) || b.author.toLowerCase().includes(query)
    );

    document.getElementById("book-count").textContent = state.books.length;

    if (filtered.length === 0) {
      document.getElementById("books-list").innerHTML = '<div class="empty-state">Noch keine Bücher in der Bibliothek</div>';
      return;
    }

    document.getElementById("books-list").innerHTML = filtered.map(b => `
      <div class="book-card">
        <div class="book-title">${escapeHtml(b.title)}</div>
        <div class="book-author">von ${escapeHtml(b.author)}</div>
        ${b.rating ? `<div class="book-rating">${b.rating}</div>` : ""}
        <div class="book-meta">
          Hinzugefügt: ${b.dateAdded}
        </div>
        ${b.notes ? `<div class="book-notes">${escapeHtml(b.notes)}</div>` : ""}
        <div class="book-actions">
          <button class="icon-btn edit" data-id="${b.id}">✎</button>
          <button class="icon-btn del" data-id="${b.id}" style="color: #ff6b6b;">✕</button>
        </div>
      </div>`).join("");

    document.querySelectorAll(".icon-btn.del").forEach(btn => {
      btn.onclick = async () => {
        state.books = state.books.filter(b => b.id !== btn.dataset.id);
        await saveData();
        render();
      };
    });

    document.querySelectorAll(".icon-btn.edit").forEach(btn => {
      btn.onclick = () => {
        const book = state.books.find(b => b.id === btn.dataset.id);
        if (book) {
          document.getElementById("book-title").value = book.title;
          document.getElementById("book-author").value = book.author;
          document.getElementById("book-notes").value = book.notes || "";
          document.getElementById("book-rating").value = book.rating || "";
          state.books = state.books.filter(b => b.id !== book.id);
          saveData().then(() => render());
        }
      };
    });
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  document.getElementById("add-book").onclick = async () => {
    const title = document.getElementById("book-title").value.trim();
    const author = document.getElementById("book-author").value.trim();
    const rating = document.getElementById("book-rating").value;
    const notes = document.getElementById("book-notes").value.trim();

    if (title && author) {
      const today = new Date().toLocaleDateString('de-DE');
      state.books.push({
        id: uid(),
        title,
        author,
        rating,
        notes,
        dateAdded: today
      });
      await saveData();
      document.getElementById("book-title").value = "";
      document.getElementById("book-author").value = "";
      document.getElementById("book-notes").value = "";
      document.getElementById("book-rating").value = "";
      render();
    }
  };

  document.getElementById("search-books").oninput = () => render();

  document.getElementById("export-books").onclick = () => {
    const json = JSON.stringify(state.books, null, 2);
    const blob = new Blob([json], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `bibliothek-${new Date().toISOString().split('T')[0]}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  // Firebase Sync


  (async function init() {
    console.log("📖 Bibliothek startet...");
    await loadData();
    // Firebase init removed
    render();
  })();
})();
</script>

</body>
</html>
